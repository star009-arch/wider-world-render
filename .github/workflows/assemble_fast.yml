name: assemble-fast
on:
  workflow_dispatch:
    inputs:
      frames_tag:
        default: cables-3d-v3
      kit_tag:
        default: cables-kit-v1
      out_tag:
        default: cables-film-v1
      parts:
        default: '10'
      scenes_run_id:
        description: reuse the scene files of an earlier run (join only)
        default: ''
      only:
        description: render only these scene ids, comma-separated
        default: ''
      shotlist:
        description: shot list file in the repo root
        default: shotlist.json
      media:
        description: media manifest in the repo root
        default: media.json
      base_runs:
        description: earlier run ids whose scene files fill in the scenes not rendered here (oldest first, comma-separated)
        default: ''
permissions:
  contents: write
env:
  WORK: D:/w
  PYTHONUTF8: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: python3 -c "import json;print('parts='+json.dumps(list(range(int('${{ inputs.parts }}')))))" >> "$GITHUB_OUTPUT"
  part:
    needs: plan
    if: inputs.scenes_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      YTG_ONLY: ${{ inputs.only }}
      YTG_MEDIA: ${{ inputs.media }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q imageio-ffmpeg
      - name: frames, visuals, kit
        env:
          KIT_KEY: ${{ secrets.KIT_KEY }}
        run: |
          mkdir -p $WORK/3d $WORK/visuals $WORK/z
          gh release download "${{ inputs.frames_tag }}" -R "$GITHUB_REPOSITORY" -D $WORK/z -p "*.zip"
          for z in $WORK/z/*.zip; do b=$(basename $z .zip); shot=${b%_*}; mkdir -p $WORK/3d/${shot}_v3; unzip -q -o $z -d $WORK/3d/${shot}_v3; done
          rm -rf $WORK/z
          gh release download "${{ inputs.kit_tag }}" -R "$GITHUB_REPOSITORY" -D $WORK -p "visuals.zip" -p "kit.enc"
          unzip -q -o $WORK/visuals.zip -d $WORK/visuals
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $WORK/kit.enc -out $WORK/kit.tar -pass env:KIT_KEY
          (cd $WORK && tar -xf kit.tar)
          if [ -d visuals_override ]; then cp visuals_override/*.mp4 $WORK/visuals/; fi
      - name: media (only this part's clips)
        run: |
          need=$(python cables_assemble.py ${{ inputs.shotlist }} "$WORK" --needs ${{ matrix.part }}/${{ inputs.parts }} | tail -1)
          echo "clips: $need"
          python fetch_media.py "$WORK" any "$need"
      - name: render scenes
        env:
          YTG_X264_THREADS: '4'
        run: |
          python cables_assemble.py ${{ inputs.shotlist }} "$WORK" --part ${{ matrix.part }}/${{ inputs.parts }}
          mkdir -p scenes && cp $WORK/segments/scene_*.mp4 scenes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.part }}
          path: scenes/
          retention-days: 7
          compression-level: 0
  join:
    needs: part
    if: always() && (needs.part.result == 'success' || needs.part.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q imageio-ffmpeg
      - run: python fetch_media.py "$WORK" music
      - name: scene files (base runs first, then this run's new scenes on top)
        run: |
          mkdir -p $WORK/segments
          for r in $(echo "${{ inputs.base_runs }}" | tr ',' ' ') ${{ inputs.scenes_run_id || github.run_id }}; do
            rm -rf dl && gh run download "$r" -R "$GITHUB_REPOSITORY" -p "scenes-*" -D dl
            find dl -name "scene_*.mp4" -exec cp -f {} $WORK/segments/ \;
            echo "run $r: $(find dl -name 'scene_*.mp4' | wc -l) scene files"
          done
          ls $WORK/segments | wc -l
      - name: kit
        env:
          KIT_KEY: ${{ secrets.KIT_KEY }}
        run: |
          gh release download "${{ inputs.kit_tag }}" -R "$GITHUB_REPOSITORY" -D $WORK -p "kit.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $WORK/kit.enc -out $WORK/kit.tar -pass env:KIT_KEY
          (cd $WORK && tar -xf kit.tar)
          ls $WORK/segments | wc -l
      - name: join and mix
        timeout-minutes: 25
        env:
          YTG_VERBOSE: '1'
        run: python cables_assemble.py ${{ inputs.shotlist }} "$WORK" --join-only
      - name: publish (encrypted)
        env:
          KIT_KEY: ${{ secrets.KIT_KEY }}
        run: |
          F=$(python -c "import json;print(json.load(open('${{ inputs.shotlist }}')).get('out_name','the_hidden_internet'))")
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in $WORK/out/$F.mp4 -out film.enc -pass env:KIT_KEY
          cp $WORK/out/timeline.json timeline.json
          gh release view "${{ inputs.out_tag }}" -R "$GITHUB_REPOSITORY" || gh release create "${{ inputs.out_tag }}" -R "$GITHUB_REPOSITORY" --title "${{ inputs.out_tag }}" --notes "Encrypted build output."
          gh release upload "${{ inputs.out_tag }}" film.enc timeline.json --clobber -R "$GITHUB_REPOSITORY"
